<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>CodeTV prueba de reproducción</title>
	<style type="text/css">
		body {
			margin: 0;
			background-color: #000000;
			color: #e9e9ed;
			font-family: sans-serif;
			font-size: 24px;
			padding: 40px;
		}

		h1 {
			font-size: 36px;
			margin: 0 0 16px 0;
		}

		video {
			width: 960px;
			height: 540px;
			background-color: #111111;
		}


		pre {
			white-space: pre-wrap;
			font-size: 20px;
			line-height: 1.4;
		}

		a {
			display: inline-block;
			padding: 8px 16px;
			border: 3px solid transparent;
			border-radius: 10px;
			text-decoration: none;
			color: #ffd60a;
			font-size: 32px;
		}

		a:focus {
			outline: none;
			border-color: #ffd60a;
			background-color: #1a1a1a;
			color: #ffffff;
		}

		#videos a {
			font-size: 24px;
			padding: 4px 12px;
		}
	</style>
</head>

<body>
	<h1>CodeTV · Prueba de reproducción (video, audio e imagen)</h1>
	<video id="player" controls></video>
	<img id="picture" alt="" style="display:none;width:960px;height:540px;object-fit:contain;">
	<div id="videos"></div>
	<pre id="log">Cargando lista de Drive…</pre>
	<script type="text/javascript" src="js/service-account.js"></script>
	<script type="text/javascript" src="js/app.js"></script>
	<script type="text/javascript">
		(function () {
			var lines = [];
			var log = document.getElementById('log');
			var player = document.getElementById('player');
			var picture = document.getElementById('picture');

			function show(text) {
				lines.push(text);
				log.textContent = lines.slice(-14).join('\n');
			}

			['loadstart', 'loadedmetadata', 'playing', 'seeked', 'ended'].forEach(function (name) {
				player.addEventListener(name, function () {
					show(name + (player.duration ? ' (duración ' + Math.round(player.duration) + ' s)' : ''));
				});
			});
			player.addEventListener('loadedmetadata', function () {
				show('pistas: audio=' + countTracks(player.audioTracks) + ', texto=' + countTracks(player.textTracks));
			});
			// Quita los <track> anteriores y agrega los subtítulos que el proxy reporte para este video.
			function loadSubtitles(videoUrl) {
				var old = player.getElementsByTagName('track');
				while (old.length) player.removeChild(old[0]);
				var parts = videoUrl.split('?');
				if (parts[0].indexOf('/stream/') < 0) {
					show('Sin subtítulos: la URL no pasa por el proxy');
					return;
				}
				var base = parts[0].replace('/stream/', '/subs/');
				var query = parts[1];
				fetch(base + '?' + query).then(function (res) {
					if (!res.ok) throw new Error('código ' + res.status);
					return res.json();
				}).then(function (tracks) {
					tracks.forEach(function (t) {
						var track = document.createElement('track');
						track.kind = 'subtitles';
						track.label = t.language;
						track.srclang = t.language;
						track.crossOrigin = 'anonymous';
						track.src = base + '/' + t.n + '.vtt?' + query;
						player.appendChild(track);
					});
					show('subtítulos: ' + tracks.length + ' pista(s) de texto');
				}).catch(function (e) {
					show('ERROR al leer subtítulos: ' + e.message);
				});
			}
			function countTracks(list) {
				return list ? list.length : 'API no disponible';
			}
			player.addEventListener('error', function () {
				var code = player.error ? player.error.code : 'desconocido';
				show('ERROR del <video>, código ' + code + ' (1 cancelado, 2 red, 3 decodificación, 4 formato no soportado)');
			});

			if (!window.CodeTV) {
				show('ERROR: no cargó js/app.js. Ejecuta npm run package:tv.');
				return;
			}

			window.CodeTV.prepareVideos('CodeTV-prueba').then(function (prepared) {
				var container = document.getElementById('videos');
				if (prepared.videos.length === 0) {
					show('No hay videos en la carpeta de prueba.');
					return;
				}
				prepared.videos.forEach(function (file) {
					var link = document.createElement('a');
					link.href = '#';
					link.textContent = 'Reproducir: ' + file.name;
					link.onclick = function () {
						show('Cargando ' + file.name + ' (' + file.kind + ')…');
						if (file.kind === 'image') {
							player.style.display = 'none';
							picture.style.display = 'block';
							picture.onload = function () { show('imagen cargada'); };
							picture.onerror = function () { show('ERROR al cargar la imagen'); };
							picture.src = prepared.url(file);
						} else {
							picture.style.display = 'none';
							player.style.display = 'block';
							var videoUrl = prepared.url(file);
							player.src = videoUrl;
							loadSubtitles(videoUrl);
							player.play();
						}
						return false;
					};
					container.appendChild(link);
				});
				function relativeSeek(delta, label) {
					return function () {
						var from = Math.round(player.currentTime);
						var target = Math.max(0, Math.min(player.duration || 0, player.currentTime + delta));
						show(label + ': de ' + from + ' s a ' + Math.round(target) + ' s');
						player.currentTime = target;
						return false;
					};
				}
				var forward = document.createElement('a');
				forward.href = '#';
				forward.textContent = 'Avanzar 60 s (prueba de seek)';
				forward.onclick = relativeSeek(60, 'Avance');
				container.appendChild(forward);
				var backward = document.createElement('a');
				backward.href = '#';
				backward.textContent = 'Retroceder 60 s (prueba de seek)';
				backward.onclick = relativeSeek(-60, 'Retroceso');
				container.appendChild(backward);
					var nextAudio = document.createElement('a');
					nextAudio.href = '#';
					nextAudio.textContent = 'Cambiar pista de audio (prueba)';
					nextAudio.onclick = function () {
						var tracks = player.audioTracks;
						if (!tracks || tracks.length < 2) {
							show('Cambio de audio no disponible: menos de 2 pistas o API ausente');
							return false;
						}
						var next = 0;
						for (var i = 0; i < tracks.length; i++) {
							if (tracks[i].enabled) next = (i + 1) % tracks.length;
						}
						for (var j = 0; j < tracks.length; j++) {
							tracks[j].enabled = (j === next);
						}
						show('Pista de audio ' + next + ' activa (idioma: ' + (tracks[next].language || 'sin dato') + ')');
						return false;
					};
					container.appendChild(nextAudio);
					var nextSub = document.createElement('a');
					nextSub.href = '#';
					nextSub.textContent = 'Cambiar subtítulo (prueba)';
					nextSub.onclick = function () {
						var tracks = player.textTracks;
						if (!tracks || tracks.length === 0) {
							show('Sin pistas de subtítulos cargadas');
							return false;
						}
						var current = -1;
						for (var i = 0; i < tracks.length; i++) {
							if (tracks[i].mode === 'showing') current = i;
						}
						var next = current + 1 < tracks.length ? current + 1 : -1;
						for (var j = 0; j < tracks.length; j++) {
							tracks[j].mode = (j === next) ? 'showing' : 'disabled';
						}
						show('subtítulo: ' + (next < 0 ? 'desactivado' : tracks[next].language));
						return false;
					};
					container.appendChild(nextSub);
				show('Listo: ' + prepared.videos.length + ' video(s). Elige uno con OK.');
			}).catch(function (e) {
				show('ERROR: ' + (e && e.message ? e.message : String(e)));
			});
		})();
	</script>
	<script type="text/javascript" src="nav.js"></script>
</body>

</html>
